name = "miler-daily-briefing-scheduler-production"
main = "src/index.ts"
compatibility_date = "2026-11-12"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Deployment safeguard: Initially inactive (crons = []) until explicit production activation
crons = []

[vars]
ENVIRONMENT = "production"
TARGET_URL = "https://miler-creater.vercel.app/api/cron/daily-briefing"
REQUEST_TIMEOUT_MS = "20000"
ALLOW_MANUAL_TRIGGER = "false"

# Encrypted Secrets configured via `wrangler secret put --config wrangler.production.toml`:
# - CRON_SECRET: Dedicated production secret matching Vercel Production
# - VERCEL_PROTECTION_BYPASS_SECRET: Optional if production deployment protection is active
